<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spagna, solo PP e Vox superano la maggioranza – Radar QN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="../assets/radar.js"></script>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title">Spagna, solo PP e Vox arrivano alla maggioranza</h1>
    <p class="r-sub">Seggi su 350 al Congresso dei deputati secondo la stima di voto, per ogni possibile alleanza. Maggioranza assoluta: 176</p>
  </header>

  <div class="r-big" id="big" aria-hidden="true">
    <span class="r-big__num" id="big-num">&nbsp;</span>
    <span class="r-big__label" id="big-label"></span>
  </div>

  <figure class="r-chart" id="radar">
    <p class="r-chart__head">Seggi per scenario</p>
  </figure>

  <footer class="r-foot">
    <span>Fonte: stima di voto per il Congresso dei deputati</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt, f0 = function (v) { return fmt(v, 0); };

  R.loadCSV("../data/scenari.csv").then(function (rows) {
    var data = rows.map(function (r) {
      return { k: r["Scenario"], det: r["Dettaglio"], v: R.num(r["Seggi"]), maj: R.num(r["Maggioranza"]) };
    });
    var maj = data[0].maj, top = d3.max(data, function (d) { return d.v; });
    var win = data.filter(function (d) { return d.v >= maj; })[0];
    var n = data.length;

    // ---- Big number ----
    var bigNum = d3.select("#big-num");
    d3.select("#big-label").text("seggi per PP + Vox, " + fmt(win.v - maj, 0) + " oltre la maggioranza di " + maj);
    if (R.reduced) bigNum.text(f0(win.v));
    else { bigNum.text(f0(0)); R.onFirstView(document.getElementById("big"), function () { R.countUp(bigNum, win.v, f0, "play"); }); }

    var host = document.getElementById("radar");
    var tip = R.tooltip(host);
    var clear = function () {};
    R.dismissOutside(host, function () { tip.hide(); clear(); });

    R.responsive(host, function (W, phase) {
      var narrow = R.isNarrow(W);
      var side = narrow ? 84 : 150;                       // spazio per le etichette laterali
      var R0 = Math.max(70, Math.min(narrow ? 110 : 190, (W - 2 * side) / 2));
      var m = { top: 46, bottom: 52 };
      var H = m.top + 2 * R0 + m.bottom, cx = W / 2, cy = m.top + R0;
      var max = 200;
      var r = d3.scaleLinear().domain([0, max]).range([0, R0]);
      var ang = function (i) { return -Math.PI / 2 + i * 2 * Math.PI / n; };
      var px = function (i, v) { return cx + r(v) * Math.cos(ang(i)); };
      var py = function (i, v) { return cy + r(v) * Math.sin(ang(i)); };
      var poly = function (vals, t) {
        return d3.line().curve(d3.curveLinearClosed)(vals.map(function (v, i) { return [px(i, v * t), py(i, v * t)]; }));
      };
      var rings = [50, 100, 150, 200];

      d3.select(host).select("svg").remove();
      var svg = d3.select(host).insert("svg", ".r-tip").attr("width", W).attr("height", H).attr("role", "img")
        .attr("aria-label", "Grafico radar: seggi su 350 per scenario. " + data.map(function (d) { return d.k + " " + f0(d.v); }).join(", ") +
          ". Solo " + win.k + " supera la maggioranza assoluta di " + maj + " seggi.");
      svg.append("title").text("Seggi al Congresso per possibile alleanza, rispetto alla maggioranza di " + maj);

      // griglia: anelli e assi
      var g = svg.append("g");
      g.append("g").attr("class", "grid").selectAll("path").data(rings).join("path")
        .attr("d", function (v) { return poly(data.map(function () { return v; }), 1); }).style("fill", "none");
      g.append("g").attr("class", "grid").selectAll("line").data(data).join("line")
        .attr("x1", cx).attr("y1", cy).attr("x2", function (d, i) { return px(i, max); }).attr("y2", function (d, i) { return py(i, max); });
      // anello della maggioranza (176), tratteggiato
      var majP = g.append("path").attr("d", poly(data.map(function () { return maj; }), 1))
        .style("fill", "none").style("stroke", "var(--ink-2)").style("stroke-width", 1.25).style("stroke-dasharray", "4 3");
      // etichetta della maggioranza, a destra dell'asse in alto
      var ml = g.append("g").attr("class", "anno");
      ml.append("text").attr("x", cx + 10).attr("y", cy - r(maj) + 2).style("font-size", "12px").style("font-weight", 600)
        .text("Maggioranza " + maj);

      // poligono dei seggi
      var shape = g.append("path").attr("class", "mark")
        .style("fill", "var(--blue)").style("fill-opacity", 0.16)
        .style("stroke", "var(--blue)").style("stroke-width", 2).style("stroke-linejoin", "round");
      var vals = data.map(function (d) { return d.v; });
      R.enter(shape, phase,
        function (s) { s.attr("d", poly(vals, 0)); },
        function (s) { s.attrTween("d", function () { return function (t) { return poly(vals, t); }; }); });

      // punti
      var dots = g.append("g").selectAll("circle").data(data).join("circle").attr("class", "mark")
        .attr("r", 5).style("stroke", "var(--bg)").style("stroke-width", 1.5)
        .style("fill", function (d) { return d.v >= maj ? "var(--red)" : "var(--blue)"; });
      R.enter(dots, phase,
        function (s) { s.attr("cx", cx).attr("cy", cy); },
        function (s) { s.attr("cx", function (d, i) { return px(i, d.v); }).attr("cy", function (d, i) { return py(i, d.v); }); });

      // etichette degli assi (nome + valore)
      var labs = g.append("g");
      data.forEach(function (d, i) {
        var a = ang(i), cs = Math.cos(a), sn = Math.sin(a), pad = 16;
        var x = cx + (R0 + pad) * cs, y = cy + (R0 + pad) * sn;
        var anchor = Math.abs(cs) < 0.3 ? "middle" : (cs > 0 ? "start" : "end");
        var t = labs.append("text").attr("class", "series-label").attr("text-anchor", anchor).attr("x", x);
        var hot = d.v >= maj;
        var name = d.k;
        if (narrow) name = { "PSOE + Fronte Ampio + Podemos": "PSOE + F. Ampio + Podemos", "Blocco dell'investitura": "Blocco investitura" }[d.k] || d.k;
        if (sn < -0.5) {            // in alto: nome sopra il punto
          t.attr("y", y - 18).text(name);
          labs.append("text").attr("class", "series-label").attr("text-anchor", anchor).attr("x", x).attr("y", y - 1)
            .style("font-size", "16px").style("fill", hot ? "var(--red)" : "var(--ink)").text(f0(d.v));
        } else if (sn > 0.5) {      // in basso
          t.attr("y", y + 12).text(name);
          labs.append("text").attr("class", "series-label").attr("text-anchor", anchor).attr("x", x).attr("y", y + 30)
            .style("font-size", "16px").style("fill", hot ? "var(--red)" : "var(--ink)").text(f0(d.v));
        } else {                    // ai lati: il valore segue l'ultima riga del nome
          t.attr("y", y - 4).text(name).call(R.wrap, side - 6, 1.25);
          var lines = t.selectAll("tspan").size() || 1;
          labs.append("text").attr("class", "series-label").attr("text-anchor", anchor).attr("x", x).attr("y", y - 4 + lines * 16.5)
            .style("font-size", "16px").style("fill", hot ? "var(--red)" : "var(--ink)").text(f0(d.v));
        }
      });
      // etichette laterali a capo: riallinea il valore sotto l'ultima riga
      labs.selectAll("text").each(function () {});

      // zone sensibili
      clear = function () { dots.classed("is-dimmed", false); shape.classed("is-dimmed", false); };
      g.append("g").selectAll("circle").data(data).join("circle").attr("class", "hit").attr("r", 22)
        .attr("cx", function (d, i) { return px(i, d.v); }).attr("cy", function (d, i) { return py(i, d.v); })
        .on("pointerenter pointerdown", function (ev, d) {
          var i = data.indexOf(d), diff = d.v - maj;
          dots.classed("is-dimmed", function (q) { return q !== d; });
          var pt = d3.pointer(ev, host);
          tip.show(R.tipHTML({
            title: d.k, value: f0(d.v), unit: "seggi",
            rows: [[diff >= 0 ? "Oltre la maggioranza" : "Alla maggioranza mancano", (diff >= 0 ? "+" : "") + f0(Math.abs(diff))],
                   ["Quota dei 350 seggi", fmt(d.v / 350 * 100, 1) + "%"]],
            note: d.det || null
          }), pt[0], pt[1]);
        })
        .on("pointerleave", function (ev) { if (ev.pointerType === "mouse") { tip.hide(); clear(); } });
    });
  }).catch(function (e) { R.fail(document.getElementById("radar"), e); });
})();
</script>
</body>
</html>
